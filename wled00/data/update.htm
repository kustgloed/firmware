<!DOCTYPE html>
<html lang="en">
<head>
	<meta content='width=device-width' name='viewport'>
	<title>Software Update</title>
	<script src="common.js" type="text/javascript"></script>
	<script>
		function GetV() {
			fetch(getURL('/kite-version'))
				.then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
				.then(d => {
					document.querySelector('.installed-version').textContent = (d.version || 'Unknown').split('+')[0];
					document.querySelector('.board-name').textContent = d.board || 'Unknown';
				})
				.catch(() => {
					document.querySelector('.installed-version').textContent = 'Unknown';
					document.querySelector('.board-name').textContent = 'Unknown';
				});
		}
		function hideforms() {
			toggle('upd');
		}
	</script>
	<style>
		@import url("style.css");
	</style>
</head>
<body onload="GetV();">
	<div class="toprow" style="min-height:64px">
	<div class="helpB"><button type="button"></button></div>
	</div>
	<form method='POST' action='./update' id='upd' enctype='multipart/form-data' onsubmit="hideforms()">
	<div class="sec">
		<h2>Software Update</h2>
		<p>
		Installed version: <span class="sip installed-version">Loading...</span><br>
		Board: <span class="sip board-name">Loading...</span><br>
		Need the new file? See the <a href="https://kustgloed.nl/en/firmware-update/" target="_blank" rel="noopener noreferrer">update guide</a>.<br>
		Red lamp blinking? See the <a href="https://kustgloed.nl/en/status-lamp/" target="_blank" rel="noopener noreferrer">status lamp codes</a>.
		</p>
		<hr class="sml">
		<h3>Manual upload</h3>
		<input type="hidden" name="skipValidation" value="" id="sV">
		Update password:<br><input type="password" name="OP" maxlength="32" autocomplete="off" required><br>
		<input type='file' name='update' required><br> <!--should have accept='.bin', but it prevents file upload from android app-->
		<input type='checkbox' onchange="sV.value=checked?1:''" id="skipValidation">
		<label for='skipValidation'>Ignore firmware validation</label><br>
		<button type="submit">Upload</button><br>
	</div>
	</form>
	<div id="Noupd" class="hide sec"><b>Updating...</b><br>Please do not close or refresh the page :)</div>
</body>
</html>
