<!DOCTYPE html>
<html lang="nl">
<head>
	<meta charset="utf-8">
	<meta content="width=device-width, initial-scale=1" name="viewport">
	<meta name="theme-color" content="#0b1a2e">
	<title>Kustgloed – Software</title>
	<script src="common.js"></script>
	<style>
		* { box-sizing: border-box; }
		body { font-family: Verdana, Helvetica, sans-serif; background: #0b1a2e; margin: 0; color: #eaf2fb; }
		.lang { position: absolute; top: 10px; right: 10px; }
		.lang button { width: 52px; margin: 0 2px; padding: 6px; font-size: 14px; }
		.lang button.on { background: #f4c542; color: #0b1a2e; }
		.wrap { max-width: 520px; margin: 0 auto; padding: 56px 16px 32px; }
		h1 { font-size: 24px; margin: 0 0 14px; }
		p, li { line-height: 1.5; color: #b9c9dc; font-size: 15px; }
		button, .btn { outline: none; cursor: pointer; font-family: helvetica; background: #1c3354; color: #fff; border: 0; border-radius: 25px; padding: 10px 18px; font-size: 16px; text-decoration: none; display: inline-block; }
		button.go { background: #f4c542; color: #0b1a2e; width: 100%; margin-top: 12px; }
		button:disabled { opacity: .5; cursor: default; }
		.card { background: #12264180; border: 1px solid #24406a; border-radius: 16px; padding: 16px; margin: 0 0 14px; }
		.card h2 { font-size: 17px; margin: 0 0 8px; }
		.n { display: inline-block; width: 24px; height: 24px; line-height: 24px; border-radius: 50%; background: #f4c542; color: #0b1a2e; text-align: center; font-size: 14px; margin-right: 8px; }
		.rows { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; margin: 0; }
		.rows dt { color: #8ea3bd; } .rows dd { margin: 0; text-align: right; }
		a { color: #6fd3ff; }
		input[type=password], input[type=file] { width: 100%; margin: 6px 0 10px; color: #eaf2fb; font-size: 15px; }
		input[type=password] { background: #0b1a2e; border: 1px solid #24406a; border-radius: 10px; padding: 10px; }
		label { font-size: 14px; color: #b9c9dc; }
		.bar { height: 12px; background: #1c3354; border-radius: 6px; overflow: hidden; margin: 12px 0 6px; }
		.bar i { display: block; height: 100%; width: 0; background: #f4c542; transition: width .2s; }
		.hint { border-color: #f4c54280; }
		.err { color: #ff8a8a; }
		.hide { display: none; }
	</style>
</head>
<body>
	<div class="lang"><button type="button" id="nl">NL</button><button type="button" id="en">EN</button></div>
	<div class="wrap">
		<p><a href="./" data-t="back"></a></p>
		<h1 data-t="title"></h1>

		<div id="form">
			<div class="card">
				<h2><span class="n">1</span><span data-t="s1"></span></h2>
				<dl class="rows">
					<dt data-t="installed"></dt><dd id="ver">…</dd>
					<dt data-t="board"></dt><dd id="board">…</dd>
				</dl>
			</div>
			<div class="card">
				<h2><span class="n">2</span><span data-t="s2"></span></h2>
				<p data-t="s2p"></p>
				<a class="btn" data-site="firmware-update/" target="_blank" rel="noopener noreferrer" data-t="s2b"></a>
			</div>
			<form class="card" id="upd" method="POST" action="./update" enctype="multipart/form-data">
				<h2><span class="n">3</span><span data-t="s3"></span></h2>
				<label for="op" data-t="pw"></label>
				<input type="password" name="OP" id="op" maxlength="32" autocomplete="off" required>
				<input type="file" name="update" id="file" required><!-- no accept=".bin": it blocks file upload from the Android app -->
				<input type="hidden" name="skipValidation" value="" id="sV">
				<input type="checkbox" id="skip" onchange="sV.value=checked?1:''"> <label for="skip" data-t="skip"></label>
				<button type="submit" class="go" data-t="upload"></button>
			</form>
			<div class="card hint">
				<h2 data-t="rbT"></h2>
				<p data-h="rbP"></p>
			</div>
		</div>

		<div class="card hide" id="prog">
			<h2 id="pT"></h2>
			<div class="bar"><i id="pBar"></i></div>
			<p id="pM"></p>
			<p>
				<a href="./" class="btn hide" id="pHome" data-t="home"></a>
				<a href="./update" class="btn hide" id="pRetry" data-t="retry"></a>
			</p>
		</div>
	</div>
	<script>
		const T = {
			nl: {
				back: '← Terug', title: 'Software bijwerken',
				s1: 'Controleer je versie', installed: 'Geïnstalleerd', board: 'Bord',
				s2: 'Download het nieuwe bestand', s2p: 'Download het bestand op een apparaat met internet. De controller zelf heeft die verbinding niet nodig.', s2b: 'Naar de update-handleiding',
				s3: 'Upload het bestand', pw: 'Update-wachtwoord', skip: 'Firmwarecontrole overslaan', upload: 'Uploaden',
				rbT: 'Gaat er iets mis?',
				rbP: 'Bewaar het vorige bestand. Knippert de statuslamp na de update rood of komt de controller niet terug, wacht dan 2 minuten en herstart hem. Helpt dat niet, upload dan het vorige bestand op deze pagina. Zie de <a data-site="status-lamp/" target="_blank" rel="noopener noreferrer">statuslamp-codes</a>.',
				up: 'Bestand uploaden…', wait: 'Controller herstart…', waitM: 'Sluit deze pagina niet. Dit duurt ongeveer een minuut.',
				done: 'Klaar', doneM: 'De controller draait nu versie {v}.', timeout: 'De controller reageert niet', timeoutM: 'Wacht nog even en probeer het opnieuw. Controleer anders de statuslamp.',
				fail: 'Upload mislukt', failM: 'Controleer het wachtwoord en het bestand en probeer opnieuw.', home: 'Naar het beginscherm', retry: 'Opnieuw proberen'
			},
			en: {
				back: '← Back', title: 'Update software',
				s1: 'Check your version', installed: 'Installed', board: 'Board',
				s2: 'Download the new file', s2p: 'Download the file on a device with internet. The controller itself does not need that connection.', s2b: 'Open the update guide',
				s3: 'Upload the file', pw: 'Update password', skip: 'Skip firmware check', upload: 'Upload',
				rbT: 'Something went wrong?',
				rbP: 'Keep the previous file. If the status lamp blinks red after the update or the controller does not come back, wait 2 minutes and restart it. If that does not help, upload the previous file on this page. See the <a data-site="status-lamp/" target="_blank" rel="noopener noreferrer">status lamp codes</a>.',
				up: 'Uploading file…', wait: 'Controller restarting…', waitM: 'Do not close this page. This takes about a minute.',
				done: 'Done', doneM: 'The controller now runs version {v}.', timeout: 'The controller does not respond', timeoutM: 'Wait a moment and try again. Otherwise check the status lamp.',
				fail: 'Upload failed', failM: 'Check the password and the file, then try again.', home: 'Back to start', retry: 'Try again'
			}
		};
		const $ = id => document.getElementById(id);
		let state = null, before = '';
		const rerender = kiteI18n(T, () => { kiteLinks(); if (state) paint(); });
		kiteVersion().then(v => { before = v.version; $('ver').textContent = v.version || '?'; $('board').textContent = v.board || '?'; })
			.catch(() => { $('ver').textContent = '?'; $('board').textContent = '?'; });
		// state: {t: title key, m: message key, p: percent, v: version, home, retry}
		function paint() {
			const t = T[kiteLang()];
			$('pT').textContent = t[state.t];
			$('pM').textContent = (t[state.m] || '').replace('{v}', state.v || '');
			$('pBar').style.width = state.p + '%';
			$('pT').className = state.retry ? 'err' : '';
			$('pHome').classList.toggle('hide', !state.home);
			$('pRetry').classList.toggle('hide', !state.retry);
		}
		function set(s) { state = s; $('form').classList.add('hide'); $('prog').classList.remove('hide'); paint(); }
		// After the upload the controller reboots; wait until it answers again.
		function waitBack(n) {
			kiteVersion().then(v => set({ t: 'done', m: 'doneM', p: 100, v: v.version, home: true }))
				.catch(() => { if (n > 0) setTimeout(() => waitBack(n - 1), 2000); else set({ t: 'timeout', m: 'timeoutM', p: 100, retry: true }); });
		}
		$('upd').onsubmit = e => {
			e.preventDefault();
			const x = new XMLHttpRequest();
			x.open('POST', './update');
			x.upload.onprogress = p => { if (p.lengthComputable) set({ t: 'up', m: '', p: Math.round(p.loaded / p.total * 100) }); };
			x.onload = () => {
				if (x.status !== 200) return set({ t: 'fail', m: 'failM', p: 0, retry: true });
				set({ t: 'wait', m: 'waitM', p: 100 });
				setTimeout(() => waitBack(45), 8000); // give the reboot time to start
			};
			x.onerror = () => { set({ t: 'wait', m: 'waitM', p: 100 }); setTimeout(() => waitBack(45), 8000); }; // the link may drop while rebooting
			set({ t: 'up', m: '', p: 0 });
			x.send(new FormData($('upd')));
		};
	</script>
</body>
</html>
