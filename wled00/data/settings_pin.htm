<!DOCTYPE html>
<html lang="en">
<head>
	<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
	<meta charset="utf-8">
	<title>PIN required</title>
	<script>
		var d = document;
		function B() { window.open("../settings","_self"); }
	</script>
	<style>
		@import url("style.css");
	</style>
</head>
<body onload="if(location.pathname.indexOf('/update')==0)d.Sf.action='/settings';d.getElementsByName('PIN')[0].focus()">
	<form id="form_s" name="Sf" method="post">
	<div class="sec">
		<h2>Please enter settings PIN code</h2>
		<input type="password" name="PIN" size="8" maxlength="8" minlength="8" pattern="[A-Za-z0-9]{8}" autocomplete="off" title="8 letters or digits" autofocus>
		<hr>
		<button type="button" onclick="B()">Back</button><button type="submit">Submit</button>
	</div>
	</form>
</body>
</html>
