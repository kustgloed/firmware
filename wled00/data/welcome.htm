<!DOCTYPE html>
<html lang="nl">
	<head>
		<meta charset="utf-8">
		<meta content="width=device-width, initial-scale=1" name="viewport">
		<meta name="theme-color" content="#222222">
		<title>Kustgloed</title>
		<script src="common.js"></script>
		<style>
			body {
				font-family: Verdana, Helvetica, sans-serif;
				text-align: center;
				background-color: #222;
				margin: 0;
				color: #fff;
			}
			.lang {
				position: absolute;
				top: 10px;
				right: 10px;
			}
			.lang button {
				width: 52px;
				margin: 0 2px;
				padding: 6px;
				font-size: 14px;
			}
			.lang button.on {
				background-color: #fff;
				color: #222;
			}
			.main {
				padding: 12vh 16px 0;
				animation: fi 1s both;
			}
			p {
				max-width: 520px;
				margin: 0 auto 28px;
				line-height: 1.5;
			}
			.main > button {
				display: block;
				width: min(280px, 90%);
				margin: 12px auto;
				padding: 10px;
				font-size: 18px;
			}
			button {
				outline: none;
				cursor: pointer;
				font-family: helvetica;
				background-color: #333;
				color: white;
				border: 0;
				border-radius: 25px;
			}
			@keyframes fi {
				from { opacity: 0; }
				to   { opacity: 1; }
			}
		</style>
	</head>
	<body>
		<div class="lang">
			<button type="button" id="nl">NL</button><button type="button" id="en">EN</button>
		</div>
		<div class="main">
			<h1 data-t="title"></h1>
			<p data-t="intro"></p>
			<button type="button" data-t="settings" onclick="window.location.href='./settings'"></button>
			<button type="button" data-t="update" onclick="window.open(kiteSite('firmware-update/'), '_blank', 'noopener,noreferrer')"></button>
			<button type="button" data-t="lamp" onclick="window.open(kiteSite('status-lamp/'), '_blank', 'noopener,noreferrer')"></button>
		</div>
		<script>
			const T = {
				nl: {
					title: 'Welkom bij Kustgloed',
					intro: 'Je Kustgloed-controller is aangesloten. Stel hier je wifi in of werk de software bij.',
					settings: 'Instellingen',
					update: 'Update-handleiding',
					lamp: 'Statuslamp-codes'
				},
				en: {
					title: 'Welcome to Kustgloed',
					intro: 'Your Kustgloed controller is connected. Set up your Wi-Fi or update the software here.',
					settings: 'Settings',
					update: 'Update guide',
					lamp: 'Status lamp codes'
				}
			};
			function render() {
				const l = kiteLang();
				document.documentElement.lang = l;
				for (const e of document.querySelectorAll('[data-t]')) e.textContent = T[l][e.dataset.t];
				for (const c of ['nl', 'en']) document.getElementById(c).classList.toggle('on', c === l);
			}
			for (const c of ['nl', 'en']) document.getElementById(c).onclick = () => { kiteSetLang(c); render(); };
			render();
		</script>
	</body>
</html>
